# Computational Biology Environment for Benchmark Questions
# This environment provides common tools for bioinformatics analysis.
#
# Target platform: linux-64 (where the benchmark runs). It also solves on most
# conda platforms, but NOT osx-arm64: bioconda has no older cyvcf2 build for
# Apple Silicon, and cooltools requires numpy<2 while current cyvcf2 requires
# numpy>=2.2, so the two cannot coexist there. Run the benchmark on linux-64.
name: compbio-benchmark
channels:
  - conda-forge
  - bioconda

dependencies:
  # Core Python
  - python=3.11
  - pip

  # Data Analysis & Scientific Computing
  # numpy<2 is required: cooltools (below) has no numpy>=2 build, and leaving
  # numpy unpinned pulls 2.x, which makes the whole env unsolvable.
  - numpy <2
  - pandas
  - scipy
  - scikit-learn

  # Visualization
  # matplotlib-base (not the matplotlib meta) avoids pulling the pyqt/qt GUI
  # stack, which is unneeded headless and conflicts during solving.
  - matplotlib-base
  - seaborn

  # Bioinformatics - Core
  - biopython
  - pysam
  - pybedtools

  # Genomics Tools
  - samtools
  - bcftools
  - bedtools
  - tabix
  # bgzip is part of htslib

  # Sequence Alignment
  - blast
  - minimap2
  - bwa

  # VCF/Variant Analysis
  - cyvcf2
  - vcftools

  # GTF/GFF Processing
  - gffutils

  # RNA-seq / Expression Analysis
  - htseq
  - subread  # provides featureCounts

  # Hi-C / 3D Genomics
  - cooler
  - cooltools

  # File Format Utilities
  - htslib

  # R / Bioconductor core (benchmark questions should prefer Bioconductor where
  # possible). Kept lean on purpose: this is just enough for BiocManager to
  # install packages at runtime. Promote frequently/slowly installed packages
  # into this list based on real run traces rather than pre-loading a wishlist.
  - r-base
  - r-biocmanager
  - bioconductor-biocversion

  # General Utilities
  - requests
  - tqdm
  - ipython

  # LLM CLI Dependencies
  - nodejs  # Required for gemini and codex CLIs

  # Pip-only packages
  - pip:
    - pyBigWig
    - pyliftover
